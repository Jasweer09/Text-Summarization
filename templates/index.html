<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Summarization</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f1f3f5;
      padding-top: 40px;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.05);
    }
    textarea {
      resize: none;
      height: 350px;
    }
    .btn-predict {
      padding: 12px 40px;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 50px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center mb-5 fw-bold text-primary">Text Summarizer</h1>
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card p-4">
          <h5 class="mb-3">Enter Your Text</h5>
          <textarea id="inputText" class="form-control" placeholder="Paste your text here..."></textarea>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-4">
          <h5 class="mb-3">Generated Summary</h5>
          <textarea id="outputText" class="form-control bg-light" readonly placeholder="The summary will appear here..."></textarea>
        </div>
      </div>
    </div>
    <div class="text-center mt-4">
      <button class="btn btn-primary btn-predict" onclick="predict()">Predict</button>
    </div>
  </div>

  <script>
    async function predict() {
      const inputText = document.getElementById("inputText").value.trim();

      if (!inputText) {
        alert("Please enter some text first.");
        return;
      }

      const response = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: inputText })
      });

      const data = await response.text();
      document.getElementById("outputText").value = data;
    }
  </script>
</body>
</html>
